name: ProRounds
options:
  bundleIdPrefix: com.prorounds
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# The layered modules live in the root Package.swift; the app target links the products it uses.
packages:
  ProRoundsModules:
    path: .

targets:
  ProRounds:
    type: application
    platform: iOS
    sources:
      - path: ProRounds
    dependencies:
      - package: ProRoundsModules
        product: ProRoundsFoundationTiming
      - package: ProRoundsModules
        product: ProRoundsFoundationUtilities
      # Config feature + the data/persistence it is wired to at the composition root.
      - package: ProRoundsModules
        product: ProRoundsFeatureConfig
      - package: ProRoundsModules
        product: ProRoundsDataConfig
      - package: ProRoundsModules
        product: ProRoundsFoundationPersistence
      - package: ProRoundsModules
        product: ProRoundsDesignSystem
      # Workout runtime + real audio (composition root wires the engine's seams).
      - package: ProRoundsModules
        product: ProRoundsFeatureTimer
      - package: ProRoundsModules
        product: ProRoundsFoundationAudio
      # Performance chart.
      - package: ProRoundsModules
        product: ProRoundsFeaturePerformance
      # Settings.
      - package: ProRoundsModules
        product: ProRoundsFeatureSettings
      - package: ProRoundsModules
        product: ProRoundsDataSettings
      # Assisted coaching: the catalog + scheduler, and the entitlement seam the root injects.
      - package: ProRoundsModules
        product: ProRoundsFoundationCoaching
    # Generated Info.plist so we can declare the audio background mode (cues fire when locked).
    info:
      path: ProRounds/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prorounds.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ProRoundsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ProRoundsUITests
    dependencies:
      - target: ProRounds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prorounds.uitests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: ProRounds
        GENERATE_INFOPLIST_FILE: "YES" # UI-test bundle has no hand-written Info.plist

schemes:
  ProRounds:
    build:
      targets:
        ProRounds: all
        ProRoundsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProRoundsUITests
    archive:
      config: Release
